<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexytop</title>
<style>
:root {
  --violet: #7C3AED; --violet2: #A78BFA; --bg: #fff; --bg2: #f8f7fc; --text: #111; --muted: #666; --border: #e8e5f0;
  --shadow: 0 8px 30px rgba(124,58,237,.12);
  --shadow-lg: 0 30px 80px rgba(0,0,0,.4);
}
[data-theme="dark"] {
  --violet: #8B5CF6; --violet2: #A78BFA; --bg: #0e0d12; --bg2: #1a1820; --text: #f5f4fa; --muted: #999; --border: #2a2740;
  --shadow: 0 8px 30px rgba(0,0,0,.4);
  --shadow-lg: 0 30px 80px rgba(0,0,0,.7);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* Header */
header { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); z-index: 50; backdrop-filter: blur(16px); }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 70px; }
.logo { font-size: 1.6rem; font-weight: 900; cursor: pointer; letter-spacing: -1px; }
.logo span { color: var(--violet); }
nav { display: flex; gap: 32px; }
nav a { color: var(--muted); text-decoration: none; cursor: pointer; font-weight: 600; font-size: .92rem; transition: color .2s; position: relative; }
nav a.active, nav a:hover { color: var(--violet); }
nav a.active::after { content:''; position:absolute; bottom:-24px; left:0; right:0; height:2px; background:var(--violet); border-radius:2px; }
.actions { display: flex; gap: 10px; }
.btn-icon { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg2); cursor: pointer; font-size: 1.1rem; position: relative; transition: .2s; }
.btn-icon:hover { border-color: var(--violet); transform: translateY(-1px); }
.badge { position: absolute; top: -6px; right: -6px; background: var(--violet); color: #fff; border-radius: 50%; font-size: .6rem; font-weight: 800; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(124,58,237,.5); }

/* Hero */
.hero { padding: 80px 0 60px; text-align: center; background: radial-gradient(ellipse at top, color-mix(in srgb, var(--violet) 15%, transparent), transparent 60%); }
.hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; margin-bottom: 16px; line-height: 1.1; letter-spacing: -1px; }
.hero h1 span { color: var(--violet); }
.hero p { color: var(--muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto; }

/* Pages */
.page { display: none; padding: 50px 0; }
.page.active { display: block; }
h1 { font-size: 2rem; margin-bottom: 28px; font-weight: 800; letter-spacing: -.5px; }

/* Grille jeux */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
.game-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 20px;
  padding: 24px 18px; text-align: center; cursor: pointer;
  transition: all .3s cubic-bezier(.4,0,.2,1);
  position: relative; overflow: hidden;
}
.game-card::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(135deg, var(--violet), var(--violet2));
  opacity:0; transition: opacity .3s; z-index:0;
}
.game-card:hover { border-color: var(--violet); transform: translateY(-6px); box-shadow: var(--shadow); }
.game-card:hover::before { opacity: .06; }
.game-card > * { position: relative; z-index: 1; }

/* LOGO CARRÉ — object-fit: cover force le carré */
.game-img {
  width: 84px; height: 84px; margin: 0 auto 14px;
  border-radius: 20px; overflow: hidden;
  background: linear-gradient(135deg, var(--violet), var(--violet2));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--violet) 30%, transparent);
}
.game-img img {
  width: 100%; height: 100%;
  object-fit: cover;  /* ← FORCE LE CARRÉ, remplit tout */
  display: block;
}
.game-img .emoji { font-size: 2.4rem; }

.game-card h3 { font-size: .98rem; margin-bottom: 6px; font-weight: 700; }
.game-card .price { color: var(--violet); font-weight: 800; font-size: .88rem; }

/* Packs */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; margin-top: 28px; }
.pack {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
  padding: 20px 16px; text-align: center; cursor: pointer; transition: .25s;
}
.pack:hover { border-color: var(--violet); transform: translateY(-3px); box-shadow: var(--shadow); }
.pack-name { font-weight: 700; font-size: .92rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pack-name img { width: 20px; height: 20px; object-fit: contain; }
.pack-price { color: var(--violet); font-weight: 800; margin-top: 8px; font-size: 1rem; }

/* Panier — fond d'image INTENSE */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(8px); z-index: 100; opacity: 0; pointer-events: none; transition: .3s; }
.overlay.open { opacity: 1; pointer-events: auto; }

.cart {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(.9);
  width: 540px; max-width: 94vw; max-height: 90vh;
  background: var(--bg); border-radius: 28px;
  z-index: 101; display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transition: .35s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}
.cart.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }

/* Fond d'image du jeu — INTENSE */
.cart-bg {
  position: absolute; inset: 0;
  background-size: 70%; background-position: center; background-repeat: no-repeat;
  opacity: .22;
  z-index: 0; pointer-events: none;
  filter: blur(2px) saturate(1.2);
}
[data-theme="dark"] .cart-bg { opacity: .3; }

/* Dégradé pour lisibilité */
.cart::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--bg) 40%, transparent) 0%,
    color-mix(in srgb, var(--bg) 85%, transparent) 40%,
    color-mix(in srgb, var(--bg) 95%, transparent) 100%);
  z-index: 0; pointer-events: none;
}

.cart-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

.cart-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 26px;
}
.cart-head h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: -.3px; }
.cart-close { background: color-mix(in srgb, var(--bg2) 80%, transparent); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 12px; font-size: 1rem; cursor: pointer; color: var(--text); transition: .2s; backdrop-filter: blur(10px); }
.cart-close:hover { border-color: var(--violet); color: var(--violet); transform: rotate(90deg); }

.cart-body { flex: 1; overflow-y: auto; padding: 8px 26px 22px; }

/* Info jeu */
.cart-info {
  display: flex; align-items: center; gap: 16px;
  padding: 18px; margin-bottom: 22px;
  background: color-mix(in srgb, var(--bg2) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  border-radius: 18px;
  backdrop-filter: blur(20px);
}
.cart-info .game-img { width: 60px; height: 60px; margin: 0; border-radius: 14px; }
.cart-info strong { display: block; font-size: 1.05rem; font-weight: 800; }
.cart-info .pack-label { color: var(--violet); font-weight: 800; font-size: 1rem; margin-top: 3px; }

.cart-foot {
  padding: 22px 26px;
  border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  background: color-mix(in srgb, var(--bg) 50%, transparent);
  backdrop-filter: blur(20px);
}
.cart-total { font-weight: 800; font-size: 1.2rem; display: flex; justify-content: space-between; margin-bottom: 16px; }
.cart-total span { color: var(--violet); }

/* Formulaires */
.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 700; font-size: .85rem; margin-bottom: 6px; }
.field input { width: 100%; padding: 13px 16px; border: 1px solid var(--border); border-radius: 14px; background: color-mix(in srgb, var(--bg) 80%, transparent); color: var(--text); font-size: 1rem; transition: .2s; backdrop-filter: blur(10px); }
.field input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 4px color-mix(in srgb, var(--violet) 15%, transparent); }

/* Boutons */
.btn { display: block; width: 100%; padding: 15px; border-radius: 14px; border: none; background: linear-gradient(135deg, var(--violet), var(--violet2)); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; transition: .2s; box-shadow: 0 6px 20px color-mix(in srgb, var(--violet) 40%, transparent); }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px color-mix(in srgb, var(--violet) 50%, transparent); }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

/* Filtres */
.filters { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
.filters input, .filters select { padding: 12px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg2); color: var(--text); font-size: .95rem; font-weight: 500; }

/* Message */
.msg { padding: 14px 18px; border-radius: 14px; margin-top: 16px; font-size: .9rem; display: none; font-weight: 600; }
.msg.ok { background: #dcfce7; color: #166534; display: block; }
.msg.err { background: #fee2e2; color: #991b1b; display: block; }
[data-theme="dark"] .msg.ok { background: #14532d; color: #86efac; }
[data-theme="dark"] .msg.err { background: #7f1d1d; color: #fca5a5; }

@media (max-width: 640px) {
  nav { gap: 18px; font-size: .85rem; }
  nav a.active::after { display: none; }
  .cart { width: 96vw; }
  .hero h1 { font-size: 1.8rem; }
}
</style>
</head>
<body>

      <h1>Catalogue</h1>
      <div class="filters">
        <input type="search" id="search" placeholder="Rechercher...">
        <select id="catFilter"><option value="all">Toutes catégories</option></select>
      </div>
      <div id="gridCatalogue" class="grid"></div>

  <section id="p-jeu" class="page">

      </div>
      <button class="btn" onclick="track()" style="max-width:220px;">Suivre</button>
      <div id="trackMsg" class="msg"></div>
    </div>
  </section>
</main>

<!-- Panier -->
<div id="overlay" class="overlay" onclick="closeCart()"></div>
<div id="cart" class="cart">

  <div class="cart-content">
    <div class="cart-head">
      <h2>Finaliser la commande</h2>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-foot">
      <div class="cart-total">Total : <span id="cartTotal">0 Ar</span></div>
      <button class="btn" id="validateBtn" onclick="validate()">Valider la commande</button>

</div>

const $ = id => document.getElementById(id);
const price = u => Math.ceil(u * USD_TO_MGA * (1+MARGIN) / ROUND) * ROUND;
const fmt = n => n.toLocaleString('fr-FR') + ' Ar';

const EMOJIS = {'pubg-mobile':'🔫','free-fire':'🔥','delta-force':'🎯','mobile-legends':'⚔️','roblox':'🧱','minecraft':'⛏️','genshin-impact':'✨','arena-breakout':'💥','honkai-star-rail':'🚂','blood-strike':'🩸','eafc-mobile-my':'⚽','steam':'🎮','discord':'💬','magic-chess-go-go-ru':'♟️','telegram-premium':'✈️','telegram-stars':'⭐','blood-strike-mena':'🩸','whiteout-survival':'❄️','magic-chess-go-go':'♟️'};

const savedTheme = localStorage.getItem('nx-theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
$('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
$('themeBtn').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nx-theme', next);
  $('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};

function go(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('p-' + page).classList.add('active');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.p === page));
  window.scrollTo(0, 0);
}

function imgHTML(slug) {
  const emoji = EMOJIS[slug] || '🎮';
  return `<div class="game-img">
    <img src="images/${slug}.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <span class="emoji" style="display:none;">${emoji}</span>
  </div>`;
}

function monnaieIcon(slug) {
  return `<img src="images/monnaie-${slug}.png" alt="" onerror="this.style.display='none';">`;
}

function renderAccueil() {
  $('gridAccueil').innerHTML = DATA.slice(0, 8).map(g => `
    <div class="game-card" onclick="ouvrirJeu('${g.slug}')">
      ${imgHTML(g.slug)}
      <h3>${g.name}</h3>
      <div class="price">dès ${fmt(price(Math.min(...g.packs.map(p=>p.u))))}</div>
    </div>`).join('');
}

function renderCatalogue() {
  const q = $('search').value.toLowerCase();
  const cat = $('catFilter').value;
  const list = DATA.filter(g => (cat==='all'||g.cat===cat) && g.name.toLowerCase().includes(q));
  $('gridCatalogue').innerHTML = list.map(g => `
    <div class="game-card" onclick="ouvrirJeu('${g.slug}')">
      ${imgHTML(g.slug)}
      <h3>${g.name}</h3>
      <div class="price">dès ${fmt(price(Math.min(...g.packs.map(p=>p.u))))}</div>
    </div>`).join('');
}
$('search').addEventListener('input', renderCatalogue);
$('catFilter').addEventListener('change', renderCatalogue);

let currentGame = null;
function ouvrirJeu(slug) {
  const game = DATA.find(g => g.slug === slug);
  if (!game) return;
  currentGame = game;
  $('gameTitle').textContent = game.name;
  $('packs').innerHTML = game.packs.map((p, i) => `
    <div class="pack" onclick="openForPack(${i})">
      <div class="pack-name">${monnaieIcon(game.slug)}${p.n}</div>
      <div class="pack-price">${fmt(price(p.u))}</div>
    </div>`).join('');
  go('jeu');
}

let selectedPackIndex = null;

function openCart() {
  $('cart').classList.add('open');
  $('overlay').classList.add('open');
}
function closeCart() {
  $('cart').classList.remove('open');
  $('overlay').classList.remove('open');
}

function openForPack(index) {
  selectedPackIndex = index;
  const p = currentGame.packs[index];
  const labels = {player_id:'Player ID',player_name:'Nom du joueur',phone:'Téléphone',uid:'UID',server:'Serveur',roblox_username:'Pseudo Roblox',steam_login:'Login Steam',discord_username:'Pseudo Discord',telegram_username:'@username',email:'Email'};

  $('cartBg').style.backgroundImage = `url('images/${currentGame.slug}.png')`;

  const fieldsHTML = currentGame.fields.map(f => `
    <div class="field">
      <label>${labels[f]||f}</label>
      <input type="text" name="${f}">
    </div>`).join('');

  $('cartBody').innerHTML = `
    <div class="cart-info">
      ${imgHTML(currentGame.slug)}
      <div>
        <strong>${currentGame.name}</strong>
        <div class="pack-label">${p.n} — ${fmt(price(p.u))}</div>
      </div>
    </div>
    ${fieldsHTML}
  `;
  $('cartTotal').textContent = fmt(price(p.u));
  openCart();
}

async function validate() {
  if (!currentGame || selectedPackIndex === null) return alert('Sélectionnez un pack.');
  const inputs = document.querySelectorAll('#cartBody input');
  const fields = {};
  for (const inp of inputs) {
    if (!inp.value.trim()) return alert('Remplissez tous les champs.');
    fields[inp.name] = inp.value.trim();
  }
  const p = currentGame.packs[selectedPackIndex];
  const btn = $('validateBtn');
  btn.disabled = true; btn.textContent = 'Envoi...';

  try {
    const { error } = await db.from('commandes').insert({
      jeu: currentGame.name,
      pack: p.n,
      prix_ar: price(p.u),
      player_id: fields.player_id || fields.uid || fields.roblox_username || fields.telegram_username || fields.steam_login || fields.email || '',
      nom_joueur: fields.player_name || fields.discord_username || '',
      telephone: fields.phone || ''
    });
    if (error) throw error;
    alert('✅ Commande enregistrée !');
    closeCart();
    selectedPackIndex = null;
    $('cartBg').style.backgroundImage = '';
  } catch (err) {
    alert('Erreur : ' + (err.message || 'réessayez'));
  } finally {
    btn.disabled = false; btn.textContent = 'Valider la commande';
  }
}

async function track() {
  const id = $('trackId').value.trim();
  const msg = $('trackMsg');
  if (!id) return;
  try {
    const { data, error } = await db.from('commandes').select('*').eq('id', id).limit(1);
    if (error) throw error;
    if (data && data.length) {
      msg.className = 'msg ok';
      msg.textContent = `Commande n°${id} : ${data[0].statut} — ${fmt(data[0].prix_ar)}`;
    } else {
      msg.className = 'msg err';
      msg.textContent = 'Commande introuvable.';
    }
  } catch {
    msg.className = 'msg err';
    msg.textContent = 'Erreur de connexion.';
  }
}

const cats = [...new Set(DATA.map(g => g.cat))];
cats.forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  $('catFilter').appendChild(o);
});
renderAccueil();
renderCatalogue();
</script>
</body>
</html>
