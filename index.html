<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexytop</title>
<style>
:root {
  --violet: #7C3AED; --violet2: #A78BFA; --violet3: #4C1D95;
  --bg: #faf9ff; --bg2: rgba(255,255,255,.7); --bg3: rgba(255,255,255,.4);
  --text: #111; --muted: #666; --border: rgba(124,58,237,.15);
  --glass: rgba(255,255,255,.55);
  --shadow: 0 8px 32px rgba(124,58,237,.15);
  --shadow-lg: 0 30px 80px rgba(0,0,0,.3);
}
[data-theme="dark"] {
  --violet: #8B5CF6; --violet2: #A78BFA; --violet3: #5B21B6;
  --bg: #0a0910; --bg2: rgba(26,24,32,.7); --bg3: rgba(26,24,32,.4);
  --text: #f5f4fa; --muted: #999; --border: rgba(139,92,246,.2);
  --glass: rgba(26,24,32,.55);
  --shadow: 0 8px 32px rgba(0,0,0,.4);
  --shadow-lg: 0 30px 80px rgba(0,0,0,.7);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: -20%;
  background:
    radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--violet) 28%, transparent), transparent 40%),
    radial-gradient(circle at 80% 30%, color-mix(in srgb, var(--violet2) 22%, transparent), transparent 40%),
    radial-gradient(circle at 50% 80%, color-mix(in srgb, var(--violet3) 25%, transparent), transparent 45%),
    radial-gradient(circle at 90% 90%, color-mix(in srgb, var(--violet) 22%, transparent), transparent 40%);
  z-index: -2;
  pointer-events: none;
  animation: float 20s ease-in-out infinite;
  filter: blur(40px);
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(3%, -3%) scale(1.05); }
  66% { transform: translate(-3%, 3%) scale(.98); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(color-mix(in srgb, var(--violet) 4%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--violet) 4%, transparent) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: -1;
  pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
}

.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

header {
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--glass);
  z-index: 50;
  backdrop-filter: blur(24px) saturate(180%);
}
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
.logo {
  font-size: 1.7rem; font-weight: 900; cursor: pointer; letter-spacing: -1.5px;
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
nav { display: flex; gap: 32px; }
nav a {
  color: var(--muted); text-decoration: none; cursor: pointer;
  font-weight: 600; font-size: .92rem; transition: color .2s; position: relative;
}
nav a.active, nav a:hover { color: var(--violet); }
nav a.active::after {
  content:''; position:absolute; bottom:-24px; left:0; right:0;
  height:3px; background: linear-gradient(90deg, var(--violet), var(--violet2));
  border-radius:3px;
}
.actions { display: flex; gap: 10px; }
.btn-icon {
  width: 44px; height: 44px; border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg2);
  cursor: pointer; font-size: 1.1rem; position: relative;
  transition: .25s; backdrop-filter: blur(20px);
}
.btn-icon:hover { border-color: var(--violet); transform: translateY(-2px); box-shadow: var(--shadow); }
.badge {
  position: absolute; top: -6px; right: -6px;
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  color: #fff; border-radius: 50%;
  font-size: .6rem; font-weight: 800;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 10px color-mix(in srgb, var(--violet) 60%, transparent);
}

.hero { padding: 90px 0 70px; text-align: center; }
.hero h1 {
  font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 900;
  margin-bottom: 18px; line-height: 1.05; letter-spacing: -2px;
}
.hero h1 span {
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p { color: var(--muted); font-size: 1.15rem; max-width: 520px; margin: 0 auto; }

.page { display: none; padding: 50px 0; }
.page.active { display: block; animation: fadeIn .4s ease; }
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
h1 { font-size: 2rem; margin-bottom: 28px; font-weight: 800; letter-spacing: -1px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
.game-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 24px 18px; text-align: center; cursor: pointer;
  transition: all .35s cubic-bezier(.4,0,.2,1);
  position: relative; overflow: hidden;
  backdrop-filter: blur(20px) saturate(150%);
}
.game-card::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  opacity:0; transition: opacity .35s; z-index:0;
}
.game-card:hover {
  border-color: color-mix(in srgb, var(--violet) 60%, transparent);
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 20px 50px color-mix(in srgb, var(--violet) 30%, transparent);
}
.game-card:hover::before { opacity: .08; }
.game-card > * { position: relative; z-index: 1; }

.game-img {
  width: 84px; height: 84px; margin: 0 auto 14px;
  border-radius: 20px; overflow: hidden;
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--violet) 35%, transparent);
  transition: transform .35s;
}
.game-card:hover .game-img { transform: rotate(-5deg) scale(1.08); }
.game-img img { width:100%; height:100%; object-fit: cover; display:block; }
.game-img .emoji { font-size: 2.4rem; }

.game-card h3 { font-size: .98rem; margin-bottom: 6px; font-weight: 700; }
.game-card .price {
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800; font-size: .9rem;
}

/* ===== PACKS avec icône monnaie 36px ===== */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-top: 28px; }
.pack {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px 16px; text-align: center; cursor: pointer;
  transition: all .3s; backdrop-filter: blur(20px);
  position: relative; overflow: hidden;
}
.pack:hover {
  border-color: var(--violet);
  transform: translateY(-4px);
  box-shadow: 0 16px 40px color-mix(in srgb, var(--violet) 25%, transparent);
}
.pack-name {
  font-weight: 700; font-size: 1rem;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  line-height: 1.3;
}
.pack-name img {
  width: 36px; height: 36px;
  object-fit: contain;
  flex-shrink: 0;
  display: block;
}
.pack-price {
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800; margin-top: 10px; font-size: 1.1rem;
}

/* ===== PANIER ===== */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  backdrop-filter: blur(12px);
  z-index: 100; opacity: 0; pointer-events: none; transition: .3s;
}
.overlay.open { opacity: 1; pointer-events: auto; }

.cart {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(.9);
  width: 540px; max-width: 94vw;
  height: 85vh; max-height: 700px;
  background: var(--glass);
  border: 1px solid color-mix(in srgb, var(--violet) 30%, transparent);
  border-radius: 28px;
  z-index: 101;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: .35s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(40px) saturate(180%);
}
.cart::before {
  content:''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--violet) 18%, transparent), transparent 40%),
    radial-gradient(circle at 100% 100%, color-mix(in srgb, var(--violet3) 18%, transparent), transparent 40%);
  pointer-events: none;
}
.cart.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }

.cart-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

.cart-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 26px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.cart-head h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.3px; }
.cart-close {
  background: var(--bg2); border: 1px solid var(--border);
  width: 38px; height: 38px; border-radius: 12px;
  font-size: 1rem; cursor: pointer; color: var(--text);
  transition: .3s; backdrop-filter: blur(20px);
}
.cart-close:hover { border-color: var(--violet); color: var(--violet); transform: rotate(90deg); }

.cart-body {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 26px;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--violet) transparent;
}
.cart-body::-webkit-scrollbar { width: 6px; }
.cart-body::-webkit-scrollbar-track { background: transparent; }
.cart-body::-webkit-scrollbar-thumb { background: var(--violet2); border-radius: 3px; }

.cart-info {
  display: flex; align-items: center; gap: 16px;
  padding: 18px; margin-bottom: 22px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 18px;
  backdrop-filter: blur(20px);
}
/* Icône du jeu dans le panier — 72px */
.cart-info .game-img { width: 72px; height: 72px; margin: 0; border-radius: 18px; flex-shrink: 0; }
.cart-info strong { display: block; font-size: 1.05rem; font-weight: 800; }
.cart-info .pack-label {
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800; font-size: 1rem; margin-top: 3px;
}

.cart-foot {
  padding: 20px 26px;
  border-top: 1px solid var(--border);
  background: var(--bg3);
  flex-shrink: 0;
}
.cart-total { font-weight: 800; font-size: 1.25rem; display: flex; justify-content: space-between; margin-bottom: 16px; }
.cart-total span {
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}

.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 700; font-size: .85rem; margin-bottom: 6px; }
.field input {
  width: 100%; padding: 13px 16px;
  border: 1px solid var(--border); border-radius: 14px;
  background: var(--bg3); color: var(--text);
  font-size: 1rem; transition: .25s; backdrop-filter: blur(20px);
}
.field input:focus {
  outline: none; border-color: var(--violet);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--violet) 15%, transparent);
}

.btn {
  display: block; width: 100%; padding: 16px;
  border-radius: 16px; border: none;
  background: linear-gradient(135deg, var(--violet), var(--violet3));
  color: #fff; font-weight: 800; font-size: 1rem;
  cursor: pointer; transition: .3s;
  box-shadow: 0 8px 28px color-mix(in srgb, var(--violet) 40%, transparent);
  position: relative; overflow: hidden;
}
.btn::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(135deg, var(--violet3), var(--violet));
  opacity:0; transition: opacity .3s;
}
.btn:hover::before { opacity: 1; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px color-mix(in srgb, var(--violet) 50%, transparent); }
.btn span { position: relative; z-index: 1; }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

.filters { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
.filters input, .filters select {
  padding: 12px 18px; border: 1px solid var(--border);
  border-radius: 14px; background: var(--bg2); color: var(--text);
  font-size: .95rem; font-weight: 500; backdrop-filter: blur(20px);
}
.filters input:focus, .filters select:focus { outline:none; border-color: var(--violet); }

.msg { padding: 14px 18px; border-radius: 14px; margin-top: 16px; font-size: .9rem; display: none; font-weight: 600; }
.msg.ok { background: #dcfce7; color: #166534; display: block; }
.msg.err { background: #fee2e2; color: #991b1b; display: block; }
[data-theme="dark"] .msg.ok { background: #14532d; color: #86efac; }
[data-theme="dark"] .msg.err { background: #7f1d1d; color: #fca5a5; }

@media (max-width: 640px) {
  nav { gap: 18px; font-size: .85rem; }
  nav a.active::after { display: none; }
  .cart { width: 96vw; height: 90vh; }
  .hero h1 { font-size: 1.9rem; }
  .pack-name img { width: 30px; height: 30px; }
  .pack-name { font-size: .92rem; gap: 8px; }
}
</style>

      <button class="btn" onclick="track()" style="max-width:220px;"><span>Suivre</span></button>
      <div id="trackMsg" class="msg"></div>
    </div>
  </section>
</main>

<div id="overlay" class="overlay" onclick="closeCart()"></div>
<div id="cart" class="cart">
  <div class="cart-content">
    <div class="cart-head">
      <h2>Finaliser la commande</h2>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-foot">

      <button class="btn" id="validateBtn" onclick="validate()"><span>Valider la commande</span></button>
    </div>
  </div>
</div>

  {slug:'whiteout-survival',name:'Whiteout Survival',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'99 Frost Stars',u:1.10},{n:'499 Frost Stars',u:5.40},{n:'999 Frost Stars',u:11.08}
  ]},
  {slug:'magic-chess-go-go',name:'Magic Chess Global',cat:'Top-ups',fields:['player_id','server','player_name','phone'],packs:[
    {n:'55 Diamonds',u:0.74},{n:'165 Diamonds',u:2.22},{n:'565 Diamonds',u:7.39}
  ]}
];

const $ = id => document.getElementById(id);
const price = u => Math.ceil(u * USD_TO_MGA * (1+MARGIN) / ROUND) * ROUND;
const fmt = n => n.toLocaleString('fr-FR') + ' Ar';

const EMOJIS = {'pubg-mobile':'🔫','free-fire':'🔥','delta-force':'🎯','mobile-legends':'⚔️','roblox':'🧱','minecraft':'⛏️','genshin-impact':'✨','arena-breakout':'💥','honkai-star-rail':'🚂','blood-strike':'🩸','eafc-mobile-my':'⚽','steam':'🎮','discord':'💬','magic-chess-go-go-ru':'♟️','telegram-premium':'✈️','telegram-stars':'⭐','blood-strike-mena':'🩸','whiteout-survival':'❄️','magic-chess-go-go':'♟️'};

const savedTheme = localStorage.getItem('nx-theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
$('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
$('themeBtn').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nx-theme', next);
  $('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};

function go(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('p-' + page).classList.add('active');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.p === page));
  window.scrollTo(0, 0);
}

function imgHTML(slug) {
  const emoji = EMOJIS[slug] || '🎮';
  return `<div class="game-img">
    <img src="images/${slug}.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <span class="emoji" style="display:none;">${emoji}</span>
  </div>`;
}

function monnaieIcon(slug) {
  return `<img src="images/monnaie-${slug}.png" alt="" onerror="this.style.display='none';">`;
}

function renderAccueil() {
  $('gridAccueil').innerHTML = DATA.slice(0, 8).map(g => `
    <div class="game-card" onclick="ouvrirJeu('${g.slug}')">
      ${imgHTML(g.slug)}
      <h3>${g.name}</h3>
      <div class="price">dès ${fmt(price(Math.min(...g.packs.map(p=>p.u))))}</div>
    </div>`).join('');
}

function renderCatalogue() {
  const q = $('search').value.toLowerCase();
  const cat = $('catFilter').value;
  const list = DATA.filter(g => (cat==='all'||g.cat===cat) && g.name.toLowerCase().includes(q));
  $('gridCatalogue').innerHTML = list.map(g => `
    <div class="game-card" onclick="ouvrirJeu('${g.slug}')">
      ${imgHTML(g.slug)}
      <h3>${g.name}</h3>
      <div class="price">dès ${fmt(price(Math.min(...g.packs.map(p=>p.u))))}</div>
    </div>`).join('');
}
$('search').addEventListener('input', renderCatalogue);
$('catFilter').addEventListener('change', renderCatalogue);

let currentGame = null;

function ouvrirJeu(slug) {
  const game = DATA.find(g => g.slug === slug);
  if (!game) return;
  currentGame = game;
  $('gameTitle').textContent = game.name;
  $('packs').innerHTML = game.packs.map((p, i) => `
    <div class="pack" onclick="openForPack(${i})">
      <div class="pack-name">${monnaieIcon(game.slug)}${p.n}</div>
      <div class="pack-price">${fmt(price(p.u))}</div>
    </div>`).join('');
  go('jeu');
}

let selectedPackIndex = null;

function openCart() {
  $('cart').classList.add('open');
  $('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  $('cart').classList.remove('open');
  $('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function openForPack(index) {
  selectedPackIndex = index;
  const p = currentGame.packs[index];
  const labels = {player_id:'Player ID',player_name:'Nom du joueur',phone:'Téléphone',uid:'UID',server:'Serveur',roblox_username:'Pseudo Roblox',steam_login:'Login Steam',discord_username:'Pseudo Discord',telegram_username:'@username',email:'Email'};

  const fieldsHTML = currentGame.fields.map(f => `
    <div class="field">
      <label>${labels[f]||f}</label>
      <input type="text" name="${f}">
    </div>`).join('');

  $('cartBody').innerHTML = `
    <div class="cart-info">
      ${imgHTML(currentGame.slug)}
      <div>
        <strong>${currentGame.name}</strong>
        <div class="pack-label">${p.n} — ${fmt(price(p.u))}</div>
      </div>
    </div>
    <div id="cartError" class="msg err" style="display:none;margin-bottom:16px;"></div>
    ${fieldsHTML}
  `;
  $('cartTotal').textContent = fmt(price(p.u));
  openCart();

  setTimeout(() => {
    const firstInput = document.querySelector('#cartBody input');
    if (firstInput) firstInput.focus();
  }, 350);
}

async function validate() {
  if (!currentGame || selectedPackIndex === null) return;

  const errEl = $('cartError');
  errEl.style.display = 'none';

  const inputs = document.querySelectorAll('#cartBody input');
  const fields = {};
  for (const inp of inputs) {
    if (!inp.value.trim()) {
      errEl.textContent = `Remplissez le champ « ${inp.previousElementSibling.textContent} ».`;
      errEl.style.display = 'block';
      inp.focus();
      return;
    }
    fields[inp.name] = inp.value.trim();
  }
  const p = currentGame.packs[selectedPackIndex];
  const btn = $('validateBtn');
  btn.disabled = true; btn.querySelector('span').textContent = 'Envoi...';

  try {
    const { error } = await db.from('commandes').insert({
      jeu: currentGame.name,
      pack: p.n,
      prix_ar: price(p.u),
      player_id: fields.player_id || fields.uid || fields.roblox_username || fields.telegram_username || fields.steam_login || fields.email || '',
      nom_joueur: fields.player_name || fields.discord_username || '',
      telephone: fields.phone || ''
    });
    if (error) throw error;
    closeCart();
    selectedPackIndex = null;
    alert('✅ Commande enregistrée ! Nous vous contacterons bientôt.');
  } catch (err) {
    errEl.textContent = 'Erreur : ' + (err.message || 'réessayez');
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.querySelector('span').textContent = 'Valider la commande';
  }
}

async function track() {
  const id = $('trackId').value.trim();
  const msg = $('trackMsg');
  if (!id) return;
  try {
    const { data, error } = await db.from('commandes').select('*').eq('id', id).limit(1);
    if (error) throw error;
    if (data && data.length) {
      msg.className = 'msg ok';
      msg.textContent = `Commande n°${id} : ${data[0].statut} — ${fmt(data[0].prix_ar)}`;
    } else {
      msg.className = 'msg err';
      msg.textContent = 'Commande introuvable.';
    }
  } catch {
    msg.className = 'msg err';
    msg.textContent = 'Erreur de connexion.';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCart();
});

const cats = [...new Set(DATA.map(g => g.cat))];
cats.forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  $('catFilter').appendChild(o);
});
renderAccueil();
renderCatalogue();
</script>
</body>
</html>
