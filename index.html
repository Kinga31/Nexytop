<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexytop</title>
<style>
:root {
  --violet: #7C3AED; --bg: #fff; --bg2: #f5f3ff; --text: #111; --muted: #666; --border: #e5e7eb;
}
[data-theme="dark"] {
  --violet: #8B5CF6; --bg: #0d0d0d; --bg2: #1a1a1a; --text: #f5f5f5; --muted: #999; --border: #2d2d2d;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
.container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

/* Header */
header { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 50; }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; }
.logo span { color: var(--violet); }
nav { display: flex; gap: 20px; }
nav a { color: var(--muted); text-decoration: none; cursor: pointer; font-weight: 500; }
nav a.active, nav a:hover { color: var(--violet); }
.actions { display: flex; gap: 8px; }
.btn-icon { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg2); cursor: pointer; font-size: 1.1rem; position: relative; }
.badge { position: absolute; top: -4px; right: -4px; background: var(--violet); color: #fff; border-radius: 50%; font-size: .65rem; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

/* Pages */
.page { display: none; padding: 40px 0; }
.page.active { display: block; }
h1 { font-size: 2rem; margin-bottom: 20px; }

/* Grille jeux */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
.game-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; transition: .2s; }
.game-card:hover { border-color: var(--violet); transform: translateY(-3px); }
.game-img { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 14px; background: var(--violet); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.game-img img { width: 100%; height: 100%; object-fit: contain; padding: 6px; box-sizing: border-box; }
.game-img .emoji { font-size: 1.6rem; }
.game-card h3 { font-size: .95rem; margin-bottom: 4px; }
.game-card .price { color: var(--violet); font-weight: 700; font-size: .85rem; }

/* Packs */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 24px; }
.pack { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; transition: .2s; }
.pack:hover { border-color: var(--violet); }
.pack-name { font-weight: 600; font-size: .9rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pack-name img { width: 18px; height: 18px; object-fit: contain; }
.pack-price { color: var(--violet); font-weight: 700; margin-top: 4px; }

/* Panier */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; opacity: 0; pointer-events: none; transition: .2s; }
.overlay.open { opacity: 1; pointer-events: auto; }
.cart { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(.9); width: 500px; max-width: 92vw; max-height: 85vh; background: var(--bg); border-radius: 20px; z-index: 101; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: .2s; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.cart.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }
.cart-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.cart-head h2 { font-size: 1.2rem; }
.cart-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text); }
.cart-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
.cart-foot { padding: 18px 22px; border-top: 1px solid var(--border); }
.cart-total { font-weight: 700; font-size: 1.1rem; display: flex; justify-content: space-between; margin-bottom: 12px; }
.cart-total span { color: var(--violet); }

/* Formulaires */
.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 4px; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 1rem; }

/* Boutons */
.btn { display: block; width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--violet); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .6; cursor: not-allowed; }

/* Info jeu dans panier */
.cart-info { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg2); border-radius: 10px; margin-bottom: 16px; }
.cart-info .game-img { width: 48px; height: 48px; margin: 0; }

/* Filtres */
.filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.filters input, .filters select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); }

/* Message */
.msg { padding: 10px 14px; border-radius: 10px; margin-top: 12px; font-size: .9rem; display: none; }
.msg.ok { background: #dcfce7; color: #166534; display: block; }
.msg.err { background: #fee2e2; color: #991b1b; display: block; }
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="logo" onclick="go('accueil')">NEXY<span>TOP</span></div>
    <nav>
      <a onclick="go('accueil')" data-p="accueil" class="active">Accueil</a>
      <a onclick="go('catalogue')" data-p="catalogue">Catalogue</a>
      <a onclick="go('suivi')" data-p="suivi">Suivi</a>
    </nav>
    <div class="actions">
      <button class="btn-icon" onclick="openCart()">🛒<span class="badge" id="badge">0</span></button>
      <button class="btn-icon" id="themeBtn">🌙</button>
    </div>
  </div>
</header>

<main>
  <section id="p-accueil" class="page active">
    <div class="container">
      <h1>Rechargez vos jeux</h1>
      <div id="gridAccueil" class="grid"></div>
    </div>
  </section>

  <section id="p-catalogue" class="page">
    <div class="container">
      <h1>Catalogue</h1>
      <div class="filters">
        <input type="search" id="search" placeholder="Rechercher...">
        <select id="catFilter"><option value="all">Toutes catégories</option></select>
      </div>
      <div id="gridCatalogue" class="grid"></div>
    </div>
  </section>

  <section id="p-jeu" class="page">
    <div class="container">
      <a onclick="go('catalogue')" style="color:var(--violet);cursor:pointer;font-weight:600;">← Retour</a>
      <h1 id="gameTitle" style="margin-top:12px;"></h1>
      <div id="packs" class="packs"></div>
    </div>
  </section>

  <section id="p-suivi" class="page">
    <div class="container">
      <h1>Suivi de commande</h1>
      <div class="field">
        <label>Numéro de commande</label>
        <input type="text" id="trackId" placeholder="ex. 1">
      </div>
      <button class="btn" onclick="track()" style="max-width:200px;">Suivre</button>
      <div id="trackMsg" class="msg"></div>
    </div>
  </section>
</main>

<!-- Panier -->
<div id="overlay" class="overlay" onclick="closeCart()"></div>
<div id="cart" class="cart">
  <div class="cart-head">
    <h2>Commande</h2>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-foot">
    <div class="cart-total">Total : <span id="cartTotal">0 Ar</span></div>
    <button class="btn" id="validateBtn" onclick="validate()">Valider</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== CONFIG ===== */
const SUPABASE_URL = 'https://cjcuwccrqeqodwpxibhv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6PUjD1K5U1TsBW6nza5c7w_nzK4bA1n';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const USD_TO_MGA = 4580, MARGIN = 0.185, ROUND = 100;

/* ===== DATA ===== */
const DATA = [
  {slug:'pubg-mobile',name:'PUBG Mobile',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'60 UC',u:0.92},{n:'325 UC',u:4.63},{n:'660 UC',u:9.17},{n:'1800 UC',u:22.91},{n:'3850 UC',u:45.76},{n:'8100 UC',u:91.34},{n:'16200 UC',u:183.34}
  ]},
  {slug:'free-fire',name:'Free Fire',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'110 Diamonds',u:0.81},{n:'572 Diamonds',u:4.00},{n:'1166 Diamonds',u:7.97},{n:'2398 Diamonds',u:15.88},{n:'6160 Diamonds',u:40.13}
  ]},
  {slug:'delta-force',name:'Delta Force',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'18 Delta Coins',u:0.25},{n:'60 Delta Coins',u:0.81},{n:'320 Delta Coins',u:4.08},{n:'750 Delta Coins',u:8.15},{n:'1980 Delta Coins',u:20.37},{n:'3950 Delta Coins',u:40.74}
  ]},
  {slug:'mobile-legends',name:'Mobile Legends',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'50+5 Diamonds',u:0.72},{n:'150+15 Diamonds',u:2.15},{n:'257 Diamonds',u:3.20},{n:'429 Diamonds',u:5.47},{n:'706 Diamonds',u:8.68},{n:'1060 Diamonds',u:13.39}
  ]},
  {slug:'roblox',name:'Roblox',cat:'Top-ups',fields:['roblox_username','phone'],packs:[
    {n:'50 Robux',u:1.04},{n:'200 Robux',u:3.03},{n:'800 Robux',u:9.54},{n:'2000 Robux',u:23.24},{n:'3000 Robux',u:35.01}
  ]},
  {slug:'minecraft',name:'Minecraft',cat:'Top-ups',fields:['email','phone'],packs:[
    {n:'Java & Bedrock',u:17.81},{n:'1720 Minecoins',u:8.64},{n:'8800 Minecoins',u:52.09}
  ]},
  {slug:'genshin-impact',name:'Genshin Impact',cat:'Top-ups',fields:['uid','server','player_name','phone'],packs:[
    {n:'60 Crystals',u:1.03},{n:'330 Crystals',u:5.14},{n:'1090 Crystals',u:15.39},{n:'2240 Crystals',u:30.77},{n:'3880 Crystals',u:51.28}
  ]},
  {slug:'arena-breakout',name:'Arena Breakout',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'66 Bonds',u:0.83},{n:'335 Bonds',u:4.17},{n:'675 Bonds',u:8.35},{n:'1690 Bonds',u:20.85},{n:'3400 Bonds',u:41.75}
  ]},
  {slug:'honkai-star-rail',name:'Honkai: Star Rail',cat:'Top-ups',fields:['uid','server','player_name','phone'],packs:[
    {n:'Express Pass',u:4.52},{n:'60 Shards',u:0.92},{n:'330 Shards',u:4.52},{n:'1090 Shards',u:14.41},{n:'2240 Shards',u:27.25}
  ]},
  {slug:'blood-strike',name:'Blood Strike',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'51 Gold',u:0.42},{n:'320 Gold',u:2.31},{n:'1100 Gold',u:7.68},{n:'2260 Gold',u:15.25}
  ]},
  {slug:'eafc-mobile-my',name:'EAFC Mobile',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'40 FC Points',u:0.51},{n:'100 FC Points',u:1.23},{n:'520 FC Points',u:5.95},{n:'1070 FC Points',u:11.18}
  ]},
  {slug:'steam',name:'Steam',cat:'Top-ups',fields:['steam_login','phone'],packs:[
    {n:'Rechargement libre',u:1.00}
  ]},
  {slug:'discord',name:'Discord',cat:'Cartes',fields:['discord_username','phone'],packs:[
    {n:'Nitro Basic 1 mois',u:4.60},{n:'Nitro 1 mois',u:9.15},{n:'Nitro 1 an',u:90.47}
  ]},
  {slug:'magic-chess-go-go-ru',name:'Magic Chess RU',cat:'Top-ups',fields:['player_id','server','player_name','phone'],packs:[
    {n:'55 Diamonds',u:1.01},{n:'275 Diamonds',u:5.04},{n:'565 Diamonds',u:10.13}
  ]},
  {slug:'telegram-premium',name:'Telegram Premium',cat:'Telegram',fields:['telegram_username','phone'],packs:[
    {n:'3 mois',u:12.54},{n:'6 mois',u:16.72},{n:'12 mois',u:30.02}
  ]},
  {slug:'telegram-stars',name:'Telegram Stars',cat:'Telegram',fields:['telegram_username','phone'],packs:[
    {n:'Stars',u:0.015637}
  ]},
  {slug:'blood-strike-mena',name:'Blood Strike MENA',cat:'Top-ups',fields:['player_id','server','player_name','phone'],packs:[
    {n:'51 GOLD',u:0.44},{n:'320 GOLD',u:2.68},{n:'1100 GOLD',u:8.95}
  ]},
  {slug:'whiteout-survival',name:'Whiteout Survival',cat:'Top-ups',fields:['player_id','player_name','phone'],packs:[
    {n:'99 Frost Stars',u:1.10},{n:'499 Frost Stars',u:5.40},{n:'999 Frost Stars',u:11.08}
  ]},
  {slug:'magic-chess-go-go',name:'Magic Chess Global',cat:'Top-ups',fields:['player_id','server','player_name','phone'],packs:[
    {n:'55 Diamonds',u:0.74},{n:'165 Diamonds',u:2.22},{n:'565 Diamonds',u:7.39}
  ]}
];

/* ===== HELPERS ===== */
const $ = id => document.getElementById(id);
const price = u => Math.ceil(u * USD_TO_MGA * (1+MARGIN) / ROUND) * ROUND;
const fmt = n => n.toLocaleString('fr-FR') + ' Ar';

const EMOJIS = {'pubg-mobile':'🔫','free-fire':'🔥','delta-force':'🎯','mobile-legends':'⚔️','roblox':'🧱','minecraft':'⛏️','genshin-impact':'✨','arena-breakout':'💥','honkai-star-rail':'🚂','blood-strike':'🩸','eafc-mobile-my':'⚽','steam':'🎮','discord':'💬','magic-chess-go-go-ru':'♟️','telegram-premium':'✈️','telegram-stars':'⭐','blood-strike-mena':'🩸','whiteout-survival':'❄️','magic-chess-go-go':'♟️'};

/* ===== THEME ===== */
const savedTheme = localStorage.getItem('nx-theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
$('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
$('themeBtn').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nx-theme', next);
  $('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
};

/* ===== NAVIGATION ===== */
function go(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('p-' + page).classList.add('active');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.p === page));
  window.scrollTo(0, 0);
}

/* ===== IMG ===== */
function imgHTML(slug) {
  const emoji = EMOJIS[slug] || '🎮';
  return `<div class="game-img">
    <img src="images/${slug}.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <span class="emoji" style="display:none;">${emoji}</span>
  </div>`;
}

function monnaieIcon(slug) {
  return `<img src="images/monnaie-${slug}.png" alt="" onerror="this.style.display='none';">`;
}

/* ===== AFFICHAGE ACCUEIL ===== */
function renderAccueil() {
  $('gridAccueil').innerHTML = DATA.slice(0, 8).map(g => `
    <div class="game-card" onclick="ouvrirJeu('${g.slug}')">
      ${imgHTML(g.slug)}
      <h3>${g.name}</h3>
      <div class="price">dès ${fmt(price(Math.min(...g.packs.map(p=>p.u))))}</div>
    </div>`).join('');
}

/* ===== AFFICHAGE CATALOGUE ===== */
function renderCatalogue() {
  const q = $('search').value.toLowerCase();
  const cat = $('catFilter').value;
  const list = DATA.filter(g => (cat==='all'||g.cat===cat) && g.name.toLowerCase().includes(q));
  $('gridCatalogue').innerHTML = list.map(g => `
    <div class="game-card" onclick="ouvrirJeu('${g.slug}')">
      ${imgHTML(g.slug)}
      <h3>${g.name}</h3>
      <div class="price">dès ${fmt(price(Math.min(...g.packs.map(p=>p.u))))}</div>
    </div>`).join('');
}
$('search').addEventListener('input', renderCatalogue);
$('catFilter').addEventListener('change', renderCatalogue);

/* ===== FICHE JEU ===== */
let currentGame = null;
function ouvrirJeu(slug) {
  const game = DATA.find(g => g.slug === slug);
  if (!game) return;
  currentGame = game;
  $('gameTitle').textContent = game.name;
  $('packs').innerHTML = game.packs.map((p, i) => `
    <div class="pack" onclick="openForPack(${i})">
      <div class="pack-name">${monnaieIcon(game.slug)}${p.n}</div>
      <div class="pack-price">${fmt(price(p.u))}</div>
    </div>`).join('');
  go('jeu');
}

/* ===== PANIER ===== */
let selectedPackIndex = null;

function openCart() {
  $('cart').classList.add('open');
  $('overlay').classList.add('open');
}
function closeCart() {
  $('cart').classList.remove('open');
  $('overlay').classList.remove('open');
}

function openForPack(index) {
  selectedPackIndex = index;
  const p = currentGame.packs[index];
  const labels = {player_id:'Player ID',player_name:'Nom du joueur',phone:'Téléphone',uid:'UID',server:'Serveur',roblox_username:'Pseudo Roblox',steam_login:'Login Steam',discord_username:'Pseudo Discord',telegram_username:'@username',email:'Email'};

  const fieldsHTML = currentGame.fields.map(f => `
    <div class="field">
      <label>${labels[f]||f}</label>
      <input type="text" name="${f}">
    </div>`).join('');

  $('cartBody').innerHTML = `
    <div class="cart-info">
      ${imgHTML(currentGame.slug)}
      <div>
        <strong>${currentGame.name}</strong><br>
        <span style="color:var(--violet);font-weight:700;">${p.n} — ${fmt(price(p.u))}</span>
      </div>
    </div>
    ${fieldsHTML}
  `;
  $('cartTotal').textContent = fmt(price(p.u));
  openCart();
}

async function validate() {
  if (!currentGame || selectedPackIndex === null) return alert('Sélectionnez un pack.');
  const inputs = document.querySelectorAll('#cartBody input');
  const fields = {};
  for (const inp of inputs) {
    if (!inp.value.trim()) return alert('Remplissez tous les champs.');
    fields[inp.name] = inp.value.trim();
  }
  const p = currentGame.packs[selectedPackIndex];
  const btn = $('validateBtn');
  btn.disabled = true; btn.textContent = 'Envoi...';

  try {
    const { error } = await db.from('commandes').insert({
      jeu: currentGame.name,
      pack: p.n,
      prix_ar: price(p.u),
      player_id: fields.player_id || fields.uid || fields.roblox_username || fields.telegram_username || fields.steam_login || fields.email || '',
      nom_joueur: fields.player_name || fields.discord_username || '',
      telephone: fields.phone || ''
    });
    if (error) throw error;
    alert('✅ Commande enregistrée !');
    closeCart();
    selectedPackIndex = null;
  } catch (err) {
    alert('Erreur : ' + (err.message || 'réessayez'));
  } finally {
    btn.disabled = false; btn.textContent = 'Valider';
  }
}

/* ===== SUIVI ===== */
async function track() {
  const id = $('trackId').value.trim();
  const msg = $('trackMsg');
  if (!id) return;
  try {
    const { data, error } = await db.from('commandes').select('*').eq('id', id).limit(1);
    if (error) throw error;
    if (data && data.length) {
      msg.className = 'msg ok';
      msg.textContent = `Commande n°${id} : ${data[0].statut} — ${fmt(data[0].prix_ar)}`;
    } else {
      msg.className = 'msg err';
      msg.textContent = 'Commande introuvable.';
    }
  } catch {
    msg.className = 'msg err';
    msg.textContent = 'Erreur de connexion.';
  }
}

/* ===== INIT ===== */
const cats = [...new Set(DATA.map(g => g.cat))];
cats.forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  $('catFilter').appendChild(o);
});
renderAccueil();
renderCatalogue();
</script>
</body>
</html>
